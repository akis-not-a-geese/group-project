<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Upload Block</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            color: white;
            padding: 28px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 15px;
        }

        .content {
            padding: 32px 24px;
        }

        .upload-section {
            margin-bottom: 24px;
        }

        .upload-section label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cover-upload-wrapper {
            position: relative;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            background: #f8fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .cover-upload-wrapper:hover {
            border-color: #6b46c1;
            background: #fafafa;
        }

        .cover-upload-wrapper.active {
            border-color: #6b46c1;
            background: #f0f4ff;
        }

        .cover-upload {
            display: none;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon svg {
            width: 36px;
            height: 36px;
            fill: #6b46c1;
        }

        .upload-text {
            font-size: 14px;
            color: #64748b;
        }

        .upload-text strong {
            color: #3b82f6;
            cursor: pointer;
        }

        .cover-preview {
            display: none;
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #6b46c1;
            box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(92, 103, 216, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            display: none;
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 14px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            align-items: center;
            gap: 10px;
        }

        .success-message.show {
            display: flex;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 24px 16px;
            }

            .upload-placeholder {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Portfolio Upload</h1>
            <p>Add your project to the portfolio</p>
        </div>

        <div class="content">
            <div class="upload-section">
                <label for="coverInput">Project/Cover Upload</label>
                <div class="cover-upload-wrapper" id="uploadWrapper">
                    <input type="file" id="coverInput" class="cover-upload" accept="image/*">
                    <div class="upload-placeholder">
                        <div class="upload-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="7,10 12,15 17,10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </div>
                        <div class="upload-text">
                            Click to upload <strong>cover image</strong> (PNG, JPG, GIF up to 5MB)</div>
                    </div>
                    <img src="" alt="Cover Preview" class="cover-preview" id="coverPreview">
                </div>
            </div>

            <div class="form-group">
                <label for="projectName">Project Name</label>
                <input type="text" id="projectName" placeholder="Enter project or work title">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Briefly describe your work..."></textarea>
            </div>

            <button class="btn" id="submitBtn" disabled>
                Upload Project
            </button>

            <div class="success-message" id="successMessage">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 11-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                Project uploaded successfully!
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const coverInput = document.getElementById('coverInput');
        const uploadWrapper = document.getElementById('uploadWrapper');
        const coverPreview = document.getElementById('coverPreview');
        const projectName = document.getElementById('projectName');
        const description = document.getElementById('description');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');

        // File upload handling
        coverInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('File must be smaller than 5MB');
                    coverInput.value = '';
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    alert('Please select an image file');
                    coverInput.value = '';
                    return;
                }

                uploadWrapper.classList.add('active');
                const reader = new FileReader();
                reader.onload = function(e) {
                    coverPreview.src = e.target.result;
                    coverPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                checkFormValidity();
            }
        });

        // Wrapper click fallback
        uploadWrapper.addEventListener('click', function(e) {
            if (!coverInput.files.length) {
                coverInput.click();
            }
        });

        // Form validation
        function checkFormValidity() {
            const hasFile = coverInput.files.length > 0;
            const hasName = projectName.value.trim().length > 0;
            const hasDescription = description.value.trim().length > 0;

            submitBtn.disabled = !(hasFile && hasName && hasDescription);
        }

        // Input event listeners for form validation
        projectName.addEventListener('input', checkFormValidity);
        description.addEventListener('input', checkFormValidity);

        // Form submission
        submitBtn.addEventListener('click', function() {
            const coverFile = coverInput.files[0];
            const name = projectName.value.trim();
            const desc = description.value.trim();

            if (!coverFile) {
                alert('Please upload a cover image');
                return;
            }

            if (!name || !desc) {
                alert('Please fill in project name and description');
                return;
            }

            // Simulate upload (in real implementation, this would send to a server)
            submitBtn.textContent = 'Uploading...';
            submitBtn.disabled = true;

            setTimeout(() => {
                submitBtn.textContent = 'Upload Project';
                submitBtn.disabled = false;
                successMessage.classList.add('show');

                // Reset form after success
                setTimeout(() => {
                    successMessage.classList.remove('show');
                    coverInput.value = '';
                    coverPreview.src = '';
                    coverPreview.style.display = 'none';
                    uploadWrapper.classList.remove('active');
                    projectName.value = '';
                    description.value = '';
                    submitBtn.disabled = true;
                }, 3000);
            }, 1500);
        });

        // Initialize
        checkFormValidity();
    </script>
</body>
</html>
