<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集與簡介網站</title>
    <style>
        :root {
            /* 淺色主題變數 */
            --bg-home: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-works: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --bg-contact: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            --nav-bg: rgba(255, 255, 255, 0.9);
            --nav-shadow: 0 4px 20px rgba(0,0,0,0.1);
            --text-nav: #2d3748;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-text: #2d3748;
            --input-bg: #ffffff;
            --input-border: #cbd5e0;
            --input-text: #1a202c;
            --btn-bg: linear-gradient(135deg, #6b46c1 0%, #5a67d8 100%);
            --btn-hover-shadow: rgba(107, 70, 193, 0.4);
            --btn-text: #ffffff;
            --scroll-indicator: #ffffff;
            --subcard-bg: #f8fafc;
        }

        [data-theme="dark"] {
            /* 深色主題變數 */
            --bg-home: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --bg-works: linear-gradient(135deg, #1e1035 0%, #2e1065 100%);
            --bg-contact: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            --nav-bg: rgba(15, 23, 42, 0.9);
            --nav-shadow: 0 4px 20px rgba(0,0,0,0.4);
            --text-nav: #f1f5f9;
            --card-bg: rgba(30, 41, 59, 0.95);
            --card-text: #f1f5f9;
            --input-bg: #0f172a;
            --input-border: #334155;
            --input-text: #f8fafc;
            --btn-bg: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --btn-hover-shadow: rgba(139, 92, 246, 0.5);
            --btn-text: #ffffff;
            --scroll-indicator: #cbd5e0;
            --subcard-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            color: var(--card-text);
        }

        /* 頂部固定導覽列 Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            box-shadow: var(--nav-shadow);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: background 0.3s ease;
        }

        nav a {
            text-decoration: none;
            color: var(--text-nav);
            font-weight: 600;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: var(--btn-bg);
            color: var(--btn-text);
        }

        /* 深淺色主題切換按鈕 */
        #themeToggle {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #themeToggle:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--btn-hover-shadow);
        }

        /* 頁面主要區塊 Section */
        .page {
            min-height: 100vh;
            padding: 100px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-margin-top: 60px;
            position: relative;
        }

        #home { background: var(--bg-home); }
        #works { background: var(--bg-works); }
        #contact { background: var(--bg-contact); }

        /* 卡片容器 */
        .card-container {
            background: var(--card-bg);
            color: var(--card-text);
            max-width: 750px;
            width: 100%;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease;
        }

        .card-container h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 28px;
        }

        /* 共用表單樣式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            color: var(--input-text);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--btn-hover-shadow);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 狀態訊息提示框 */
        .message-box {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }

        .message-box.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .message-box.error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        /* ===== 首頁 (Home) 樣式 ===== */
        .profile-display-card {
            background: var(--subcard-bg);
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
            border: 1px solid var(--input-border);
        }

        /* ===== 作品頁 (Works) 樣式 ===== */
        .upload-section {
            background: var(--subcard-bg);
            border: 1px dashed var(--input-border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .cover-upload-wrapper {
            border: 2px dashed var(--input-border);
            border-radius: 12px;
            background: var(--input-bg);
            cursor: pointer;
            text-align: center;
            padding: 24px 16px;
            transition: all 0.3s ease;
        }

        .cover-upload-wrapper:hover {
            border-color: #8b5cf6;
        }

        .cover-upload-input { display: none; }

        .upload-icon svg {
            width: 42px;
            height: 42px;
            fill: #8b5cf6;
        }

        .cover-preview {
            display: none;
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* 作品動態列表 */
        .work-item {
            background: var(--subcard-bg);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 5px solid #3b82f6;
            transition: all 0.3s ease;
        }

        .work-item.private { border-left-color: #ef4444; }
        .work-item.public { border-left-color: #22c55e; }

        .work-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Switch 開關 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e0;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }

        .status-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.public { background: #dcfce7; color: #15803d; }
        .status-badge.private { background: #fee2e2; color: #b91c1c; }

        /* ===== 聯絡頁 (Contact) 樣式 ===== */
        .contact-info-list {
            list-style: none;
            background: var(--subcard-bg);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .contact-info-list li {
            padding: 6px 0;
            font-size: 15px;
        }

        /* 下滑指示器 Arrow */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: var(--scroll-indicator);
            text-decoration: none;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -15px); }
            60% { transform: translate(-50%, -7px); }
        }

        /* 返回頂部按鈕 Floating Button */
        .back-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 900;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .back-top.show {
            opacity: 1;
            visibility: visible;
        }

        .back-top:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">首頁</a>
        <a href="#works">作品集</a>
        <a href="#contact">聯絡我</a>
        <button id="themeToggle" aria-label="主題切換">
            <span id="themeIcon">🌙</span>
            <span id="themeText">Dark</span>
        </button>
    </nav>

    <section id="home" class="page">
        <div class="card-container">
            <h1>自我介紹</h1>
            <div class="form-group">
                <label for="homeName">名字：</label>
                <input type="text" id="homeName" placeholder="請輸入您的名字">
            </div>
            <div class="form-group">
                <label for="homeIntro">自我介紹：</label>
                <textarea id="homeIntro" rows="3" placeholder="請寫下一段簡短的自我介紹..."></textarea>
            </div>
            <button class="btn" onclick="saveHomeIntro()">儲存個人簡介</button>
            <div id="homeMessage" class="message-box"></div>

            <div class="profile-display-card" id="profileDisplay" style="display: none;">
                <h3 id="displayName" style="color: #8b5cf6; margin-bottom: 6px;"></h3>
                <p id="displayIntro" style="line-height: 1.6; opacity: 0.9;"></p>
            </div>
        </div>
        <a href="#works" class="scroll-indicator">↓</a>
    </section>

    <section id="works" class="page">
        <div class="card-container">
            <h1>我的作品專案</h1>

            <div class="upload-section">
                <h3 style="margin-bottom: 12px;">新增作品專案</h3>
                <div class="form-group">
                    <label>作品封面圖片</label>
                    <div class="cover-upload-wrapper" id="uploadWrapper">
                        <input type="file" id="coverInput" class="cover-upload-input" accept="image/*">
                        <div id="uploadPlaceholder">
                            <div class="upload-icon">
                                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </div>
                            <p style="font-size: 13px; opacity: 0.8; margin-top: 6px;">點擊選擇圖片檔 (PNG, JPG < 5MB)</p>
                        </div>
                        <img src="" alt="封面預覽" class="cover-preview" id="coverPreview">
                    </div>
                </div>

                <div class="form-group">
                    <label for="projectName">作品名稱</label>
                    <input type="text" id="projectName" placeholder="例如：響應式電商網站設計">
                </div>

                <div class="form-group">
                    <label for="projectDesc">作品描述</label>
                    <textarea id="projectDesc" rows="2" placeholder="請簡述專案亮點與技術棧..."></textarea>
                </div>

                <button class="btn" id="uploadSubmitBtn" disabled>發布作品</button>
                <div id="uploadSuccessMsg" class="message-box"></div>
            </div>

            <h3 style="margin-bottom: 12px;">已發布作品清單</h3>
            <div id="portfolio-container"></div>
        </div>
        <a href="#contact" class="scroll-indicator">↓</a>
    </section>

    <section id="contact" class="page">
        <div class="card-container">
            <h1>聯絡我</h1>
            <p style="text-align: center; margin-bottom: 20px; opacity: 0.8;">
                如果有任何合作建議，歡迎隨時透過下方表單聯絡！
            </p>

            <ul class="contact-info-list">
                <li>📧 <strong>Email:</strong> your@email.com</li>
                <li>🐙 <strong>GitHub:</strong> @yourusername</li>
                <li>💬 <strong>WeChat/Line:</strong> your-contact-id</li>
            </ul>

            <form id="contactForm">
                <div class="form-group">
                    <label for="contactName">姓名</label>
                    <input type="text" id="contactName" placeholder="請輸入您的姓名">
                </div>

                <div class="form-group">
                    <label for="contactEmail">Email</label>
                    <input type="email" id="contactEmail" placeholder="請輸入您的 Email">
                </div>

                <div class="form-group">
                    <label for="contactMessage">留言內容</label>
                    <textarea id="contactMessage" rows="3" placeholder="請輸入您的訊息..."></textarea>
                </div>

                <button type="submit" class="btn">送出訊息</button>
            </form>
            <div id="contactFormResult" class="message-box"></div>
        </div>
    </section>

    <button id="backToTop" class="back-top" aria-label="返回頂部">↑</button>

    <script>
        // ================= 1. 深淺色主題切換 (Theme Toggle) =================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const html = document.documentElement;

        function getInitialTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
            }
        }

        applyTheme(getInitialTheme());

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ================= 2. 首頁自我介紹 (Profile Persistence) =================
        function saveHomeIntro() {
            const name = document.getElementById('homeName').value.trim();
            const intro = document.getElementById('homeIntro').value.trim();
            const msgBox = document.getElementById('homeMessage');

            if (name && intro) {
                msgBox.className = 'message-box success';
                msgBox.textContent = '個人簡介已成功更新！';
                
                document.getElementById('displayName').textContent = name;
                document.getElementById('displayIntro').textContent = intro;
                document.getElementById('profileDisplay').style.display = 'block';

                localStorage.setItem('userProfile', JSON.stringify({ name, intro }));
            } else {
                msgBox.className = 'message-box error';
                msgBox.textContent = '請完整填寫姓名與自我介紹';
            }
        }

        function loadHomeIntro() {
            const saved = JSON.parse(localStorage.getItem('userProfile') || '{}');
            if (saved.name && saved.intro) {
                document.getElementById('homeName').value = saved.name;
                document.getElementById('homeIntro').value = saved.intro;
                document.getElementById('displayName').textContent = saved.name;
                document.getElementById('displayIntro').textContent = saved.intro;
                document.getElementById('profileDisplay').style.display = 'block';
            }
        }

        // ================= 3. 作品列表與公開/私密切換 =================
        function initPortfolio() {
            const container = document.getElementById('portfolio-container');
            container.innerHTML = '';
            for (let i = 1; i <= 3; i++) {
                container.appendChild(createWorkItem(i));
            }
            loadWorkStates();
        }

        function createWorkItem(index) {
            const item = document.createElement('div');
            item.className = 'work-item';
            item.dataset.index = index;

            item.innerHTML = `
                <div class="work-header">
                    <div>
                        <span style="font-size:12px; opacity:0.7;">專案 #${index}</span>
                        <h4 style="margin-top:2px;">範例作品 ${index}</h4>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:13px; font-weight:600;">公開：</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-${index}">
                            <span class="slider"></span>
                        </label>
                        <span class="status-badge" id="status-${index}">私密</span>
                    </div>
                </div>
                <p style="font-size:14px; opacity:0.85;">這是範例作品 ${index} 的說明範例，支援即時隱私切換與狀態保存。</p>
            `;

            item.querySelector(`#toggle-${index}`).addEventListener('change', function() {
                updateWorkStatus(index, this.checked);
            });

            return item;
        }

        function updateWorkStatus(index, isPublic) {
            const statusBadge = document.getElementById(`status-${index}`);
            const item = document.querySelector(`.work-item[data-index="${index}"]`);
            const toggle = document.getElementById(`toggle-${index}`);

            if (toggle) toggle.checked = isPublic;

            if (isPublic) {
                statusBadge.textContent = '公開';
                statusBadge.className = 'status-badge public';
                item.className = 'work-item public';
            } else {
                statusBadge.textContent = '私密';
                statusBadge.className = 'status-badge private';
                item.className = 'work-item private';
            }

            const workStates = JSON.parse(localStorage.getItem('workStates') || '{}');
            workStates[index] = isPublic;
            localStorage.setItem('workStates', JSON.stringify(workStates));
        }

        function loadWorkStates() {
            const workStates = JSON.parse(localStorage.getItem('workStates') || '{}');
            for (let i = 1; i <= 3; i++) {
                const isPublic = workStates[i] !== undefined ? workStates[i] : false;
                updateWorkStatus(i, isPublic);
            }
        }

        // ================= 4. 圖文作品上傳驗證與預覽 =================
        const coverInput = document.getElementById('coverInput');
        const uploadWrapper = document.getElementById('uploadWrapper');
        const coverPreview = document.getElementById('coverPreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const projectName = document.getElementById('projectName');
        const projectDesc = document.getElementById('projectDesc');
        const uploadSubmitBtn = document.getElementById('uploadSubmitBtn');
        const uploadSuccessMsg = document.getElementById('uploadSuccessMsg');

        uploadWrapper.addEventListener('click', () => coverInput.click());

        coverInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('圖片不可超過 5MB');
                    coverInput.value = '';
                    return;
                }
                if (!file.type.startsWith('image/')) {
                    alert('請選擇圖片檔案');
                    coverInput.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    coverPreview.src = e.target.result;
                    coverPreview.style.display = 'block';
                    uploadPlaceholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
                checkUploadValidity();
            }
        });

        function checkUploadValidity() {
            const hasFile = coverInput.files.length > 0;
            const hasName = projectName.value.trim().length > 0;
            const hasDesc = projectDesc.value.trim().length > 0;
            uploadSubmitBtn.disabled = !(hasFile && hasName && hasDesc);
        }

        projectName.addEventListener('input', checkUploadValidity);
        projectDesc.addEventListener('input', checkUploadValidity);

        uploadSubmitBtn.addEventListener('click', function() {
            uploadSubmitBtn.textContent = '發布中...';
            uploadSubmitBtn.disabled = true;

            setTimeout(() => {
                uploadSubmitBtn.textContent = '發布作品';
                uploadSuccessMsg.className = 'message-box success';
                uploadSuccessMsg.textContent = '專案成功發布！';

                setTimeout(() => {
                    uploadSuccessMsg.className = 'message-box';
                    coverInput.value = '';
                    coverPreview.src = '';
                    coverPreview.style.display = 'none';
                    uploadPlaceholder.style.display = 'block';
                    projectName.value = '';
                    projectDesc.value = '';
                    uploadSubmitBtn.disabled = true;
                }, 2000);
            }, 1000);
        });

        // ================= 5. 聯絡表單驗證 =================
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const message = document.getElementById('contactMessage').value.trim();
            const result = document.getElementById('contactFormResult');

            if (!name) return showContactMsg('請輸入姓名', 'error');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showContactMsg('請輸入正確的 Email 格式', 'error');
            if (!message) return showContactMsg('請輸入留言內容', 'error');

            showContactMsg('感謝您的留言，我會盡快回覆！', 'success');
            e.target.reset();
        });

        function showContactMsg(msg, type) {
            const res = document.getElementById('contactFormResult');
            res.textContent = msg;
            res.className = `message-box ${type}`;
        }

        // ================= 6. 返回頂部按鈕 (Back to Top) =================
        const backToTop = document.getElementById('backToTop');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTop.classList.add('show');
            } else {
                backToTop.classList.remove('show');
            }
        });

        backToTop.addEventListener('click', () => {
            document.getElementById('home').scrollIntoView({ behavior: 'smooth' });
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadHomeIntro();
            initPortfolio();
        });
    </script>
</body>
</html>
