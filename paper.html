<!DOCTYPE html>
  <html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>剪刀石頭布</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 20px;
      }
      .game-container {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        padding: 40px;
        max-width: 450px;
        width: 100%;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .game-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 10px;
        font-size: 28px;
        font-weight: 600;
      }
      .subtitle {
        color: #64748b;
        font-size: 16px;
        margin-bottom: 30px;
      }
      .game-board {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        margin: 30px 0;
        align-items: center;
      }
      .player-hand, .opponent-hand {
        background: #f8fafc;
        border-radius: 12px;
        padding: 25px;
        border: 2px solid #e2e8f0;
        transition: all 0.3s ease;
      }
      .hand-label {
        font-size: 14px;
        color: #64748b;
        margin-bottom: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .hand-display {
        font-size: 60px;
        margin: 10px 0;
      }
      .choice-btn {
        width: 80px;
        height: 80px;
        border: none;
        border-radius: 50%;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
      }
      .choice-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3));
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .choice-btn:hover::before {
        opacity: 1;
      }
      .choice-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      }
      .choice-btn:active {
        transform: translateY(-1px);
      }
      .rock { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
      .scissors { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; }
      .paper { background: linear-gradient(135deg, #10b981, #059669); color: white; }
      .result-section {
        margin: 30px 0;
        padding: 20px;
        border-radius: 12px;
        background: #f1f5f9;
        min-height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .result-text {
        font-size: 20px;
        font-weight: 700;
        padding: 15px 25px;
        border-radius: 10px;
        text-align: center;
        animation: fadeIn 0.5s ease;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
      }
      .result-win {
        background: linear-gradient(135deg, #d4edda, #c3e6cb);
        color: #155724;
        border: 2px solid #2ecc71;
      }
      .result-lose {
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        color: #721c24;
        border: 2px solid #e74c3c;
      }
      .result-draw {
        background: linear-gradient(135deg, #e0f2fe, #bae6fd);
        color: #0c4a6e;
        border: 2px solid #3498db;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 480px) {
        .game-container { padding: 25px 20px; }
        .hand-display { font-size: 50px; }
        .choice-btn { width: 70px; height: 70px; font-size: 24px; }
        .game-board { gap: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <h1>🎮 剪刀石頭布</h1>
      <p class="subtitle">選擇你的武器，看看你能否擊敗電腦吧！</p>

      <div class="game-board">
        <div class="player-hand">
          <div class="hand-label">玩家</div>
          <div class="hand-display" id="player-hand">❔</div>
        </div>

        <button class="choice-btn scissors" onclick="playGame('scissors')">✂️</button>
        <button class="choice-btn rock" onclick="playGame('rock')">🪨</button>
        <button class="choice-btn paper" onclick="playGame('paper')">📄</button>

        <div class="opponent-hand">
          <div class="hand-label">電腦AI</div>
          <div class="hand-display" id="opponent-hand">❔</div>
        </div>
      </div>

      <div class="result-section">
        <div class="result-text" id="result-text">點擊按鈕開始遊戲！</div>
      </div>
    </div>

    <script>
      const hands = {
        rock:     { emoji: '🪨', label: '石頭', beats: 'scissors' },
        scissors: { emoji: '✂️', label: '剪刀', beats: 'paper' },
        paper:    { emoji: '📄', label: '布',   beats: 'rock' }
      };

      function getRandomChoice() {
        const keys = Object.keys(hands);
        return keys[Math.floor(Math.random() * keys.length)];
      }

      function playGame(playerChoice) {
        const playerHandEl = document.getElementById('player-hand');
        const opponentHandEl = document.getElementById('opponent-hand');
        const resultEl = document.getElementById('result-text');

        const opponentChoice = getRandomChoice();

        // 顯示出拳
        playerHandEl.textContent = hands[playerChoice].emoji;
        opponentHandEl.textContent = hands[opponentChoice].emoji;

        // 判斷結果
        let resultClass = '';
        let resultText = '';

        if (playerChoice === opponentChoice) {
          resultClass = 'result-draw';
          resultText = `🤝 平手！<br>雙方出的是 ${hands[playerChoice].label}`;
        } else if (hands[playerChoice].beats === opponentChoice) {
          resultClass = 'result-win';
          resultText = `🎉 恭喜勝利！<br>${hands[playerChoice].label} 勝 ${hands[opponentChoice].label}`;
        } else {
          resultClass = 'result-lose';
          resultText = `❌ 很可惜，失敗了。<br>${hands[opponentChoice].label} 勝 ${hands[playerChoice].label}`;
        }

        resultEl.className = 'result-text ' + resultClass;
        resultEl.innerHTML = resultText;
      }
    </script>
  </body>
  </html>
